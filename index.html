<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <h1 class="logo">MovieHub</h1>
    <input id="search" type="search" placeholder="Tìm phim...">
    <button id="favBtn">❤ Yêu thích</button>
  </header>

  <section id="hero" class="hero"></section>
  <main id="rows"></main>
  <section id="results" class="grid hidden"></section>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <footer>Dữ liệu phim từ TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
  <script src="app.js"></script>
</body>
</html>
