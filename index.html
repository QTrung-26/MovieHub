<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <h1 class="logo" style="cursor: pointer;" onclick="loadData('phim-moi-cap-nhat', 1)">MovieHub</h1>
    
    <!-- Menu chọn thể loại -->
    <nav class="categories" style="display: flex; gap: 10px; margin: 0 20px;">
      <button onclick="loadData('phim-moi-cap-nhat', 1)">Mới Nhất</button>
      <button onclick="loadData('phim-le', 1)">Phim Lẻ</button>
      <button onclick="loadData('phim-bo', 1)">Phim Bộ</button>
      <button onclick="loadData('hoat-hinh', 1)">Hoạt Hình</button>
      <button onclick="loadData('tv-shows', 1)">TV Shows</button>
    </nav>

    <input id="search" type="search" placeholder="Tìm kiếm phim...">
    <button id="favBtn">❤ Yêu thích</button>
  </header>

  <!-- Ẩn khung player khi chưa bấm xem phim để không bị khoảng đen -->
  <section id="player-container" style="display: none;"></section>
  
  <section id="hero" class="hero"></section>
  <main id="rows"></main>
  <div id="pagination"></div>

  <footer>Dữ liệu phim từ KKPhim API.</footer>
  
  <script src="app.js"></script>
</body>
</html>
