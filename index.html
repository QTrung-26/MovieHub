<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QT - Xem phim online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#070d18">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Bộ icon dùng chung -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-series" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 12h18"/></symbol>
      <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 2.5 3 4 3s3-1 4-3M9 9.5h.01M15 9.5h.01"/></symbol>
      <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
      <symbol id="i-ghost" viewBox="0 0 24 24"><path d="M5 21V10a7 7 0 0 1 14 0v11l-3-2-2 2-2-2-2 2-2-2z"/><path d="M9.5 10h.01M14.5 10h.01"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></symbol>
      <symbol id="i-laugh" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7.5 12.5h9a4.5 4.5 0 0 1-9 0zM9 9h.01M15 9h.01"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2.5 4 2.5 4H5"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    </defs>
  </svg>

  <header class="site-header">
    <div class="top-bar">
      <button class="logo" data-cat="phim-moi-cap-nhat" data-label="Trang chủ" onclick="goTo(this)" aria-label="QT - Trang chủ">
        <img class="logo-img" src="logo.png" alt="">
        <span class="logo-text">QT</span>
      </button>

      <div class="top-menus">
        <details class="dd">
          <summary>Thể loại</summary>
          <div class="dd-menu">
            <button data-cat="the-loai/hanh-dong" data-label="Hành động" onclick="goTo(this)">Hành động</button>
            <button data-cat="the-loai/kinh-di" data-label="Kinh dị" onclick="goTo(this)">Kinh dị</button>
            <button data-cat="the-loai/vien-tuong" data-label="Viễn tưởng" onclick="goTo(this)">Viễn tưởng</button>
            <button data-cat="the-loai/tinh-cam" data-label="Tình cảm" onclick="goTo(this)">Tình cảm</button>
            <button data-cat="the-loai/hai-huoc" data-label="Hài hước" onclick="goTo(this)">Hài hước</button>
            <button data-cat="the-loai/co-trang" data-label="Cổ trang" onclick="goTo(this)">Cổ trang</button>
            <button data-cat="the-loai/hinh-su" data-label="Hình sự" onclick="goTo(this)">Hình sự</button>
            <button data-cat="the-loai/phieu-luu" data-label="Phiêu lưu" onclick="goTo(this)">Phiêu lưu</button>
            <button data-cat="the-loai/chien-tranh" data-label="Chiến tranh" onclick="goTo(this)">Chiến tranh</button>
            <button data-cat="the-loai/tam-ly" data-label="Tâm lý" onclick="goTo(this)">Tâm lý</button>
          </div>
        </details>
        <details class="dd">
          <summary>Quốc gia</summary>
          <div class="dd-menu">
            <button data-cat="quoc-gia/viet-nam" data-label="Việt Nam" onclick="goTo(this)">Việt Nam</button>
            <button data-cat="quoc-gia/han-quoc" data-label="Hàn Quốc" onclick="goTo(this)">Hàn Quốc</button>
            <button data-cat="quoc-gia/trung-quoc" data-label="Trung Quốc" onclick="goTo(this)">Trung Quốc</button>
            <button data-cat="quoc-gia/nhat-ban" data-label="Nhật Bản" onclick="goTo(this)">Nhật Bản</button>
            <button data-cat="quoc-gia/au-my" data-label="Âu Mỹ" onclick="goTo(this)">Âu Mỹ</button>
            <button data-cat="quoc-gia/thai-lan" data-label="Thái Lan" onclick="goTo(this)">Thái Lan</button>
            <button data-cat="quoc-gia/dai-loan" data-label="Đài Loan" onclick="goTo(this)">Đài Loan</button>
            <button data-cat="quoc-gia/hong-kong" data-label="Hồng Kông" onclick="goTo(this)">Hồng Kông</button>
          </div>
        </details>
      </div>

      <div class="search-box">
        <input id="search" type="search" placeholder="Phim, diễn viên, thể loại..." aria-label="Tìm kiếm" enterkeyhint="search">
        <button class="search-btn" id="search-btn" type="button" aria-label="Tìm kiếm"><svg class="ico"><use href="#i-search"/></svg></button>
      </div>

      <div class="top-actions">
        <button class="icon-btn" data-cat="favorites" data-label="Phim yêu thích" onclick="goTo(this)" aria-label="Phim yêu thích">
          <svg class="ico"><use href="#i-heart"/></svg><span class="badge" id="fav-count" hidden>0</span>
        </button>
        <div class="pop-wrap">
          <button class="icon-btn" id="bell-btn" aria-label="Thông báo"><svg class="ico"><use href="#i-bell"/></svg><span class="badge" id="bell-badge" hidden>0</span></button>
          <div class="pop" id="notif-panel" hidden><h3>Thông báo</h3><div id="notif-list"></div></div>
        </div>
        <button class="icon-btn" id="settings-btn" aria-label="Cài đặt"><svg class="ico"><use href="#i-sliders"/></svg></button>

        <div class="guest-actions" id="guest-actions">
          <a class="login-icon" href="login.html" aria-label="Đăng nhập" title="Đăng nhập"><svg class="ico"><use href="#i-user"/></svg></a>
        </div>
        <div class="pop-wrap">
          <button class="avatar" id="user-btn" aria-label="Tài khoản" hidden></button>
          <div class="pop" id="user-panel" hidden>
            <div class="user-info"><strong id="user-name"></strong><small id="user-email"></small></div>
            <button class="pop-link" data-cat="favorites" data-label="Phim yêu thích" onclick="goTo(this)">Phim yêu thích</button>
            <button class="pop-link" id="logout-btn">Đăng xuất</button>
          </div>
        </div>
      </div>
    </div>

    <div class="chip-bar">
      <h2 class="section-label" id="section-label">Trang chủ</h2>
      <span class="chip-divider"></span>
      <div class="chips" id="chips">
        <button class="chip" data-cat="phim-bo" data-label="Phim bộ" onclick="goTo(this)"><svg class="ico"><use href="#i-series"/></svg>Phim bộ</button>
        <button class="chip" data-cat="quoc-gia/han-quoc" data-label="Phim Hàn" onclick="goTo(this)"><svg class="ico"><use href="#i-flag"/></svg>Phim Hàn</button>
        <button class="chip" data-cat="phim-le" data-label="Phim lẻ" onclick="goTo(this)"><svg class="ico"><use href="#i-film"/></svg>Phim lẻ</button>
        <button class="chip" data-cat="hoat-hinh" data-label="Hoạt hình" onclick="goTo(this)"><svg class="ico"><use href="#i-smile"/></svg>Hoạt hình</button>
        <button class="chip" data-cat="tv-shows" data-label="TV Shows" onclick="goTo(this)"><svg class="ico"><use href="#i-tv"/></svg>TV Shows</button>
        <button class="chip" data-cat="the-loai/hanh-dong" data-label="Hành động" onclick="goTo(this)"><svg class="ico"><use href="#i-bolt"/></svg>Hành động</button>
        <button class="chip" data-cat="the-loai/kinh-di" data-label="Kinh dị" onclick="goTo(this)"><svg class="ico"><use href="#i-ghost"/></svg>Kinh dị</button>
        <button class="chip" data-cat="the-loai/vien-tuong" data-label="Viễn tưởng" onclick="goTo(this)"><svg class="ico"><use href="#i-star"/></svg>Viễn tưởng</button>
        <button class="chip" data-cat="the-loai/tinh-cam" data-label="Tình cảm" onclick="goTo(this)"><svg class="ico"><use href="#i-heart"/></svg>Tình cảm</button>
        <button class="chip" data-cat="the-loai/hai-huoc" data-label="Hài hước" onclick="goTo(this)"><svg class="ico"><use href="#i-laugh"/></svg>Hài hước</button>
      </div>
      <button class="chip-next" id="chip-next" aria-label="Xem thêm danh mục">›</button>
    </div>
  </header>

  <dialog class="modal" id="settings-dialog">
    <div class="auth-box">
      <button class="auth-close" id="settings-close" aria-label="Đóng">×</button>
      <h2>Cài đặt</h2>
      <div class="set-row">
        <h3>Màu chủ đạo</h3>
        <div class="swatches">
          <button class="swatch" data-color="#2aa8ff" style="--c:#2aa8ff" aria-label="Xanh đại dương"></button>
          <button class="swatch" data-color="#8b7bff" style="--c:#8b7bff" aria-label="Tím"></button>
          <button class="swatch" data-color="#2ed3a0" style="--c:#2ed3a0" aria-label="Xanh ngọc"></button>
          <button class="swatch" data-color="#ff9f1c" style="--c:#ff9f1c" aria-label="Cam"></button>
          <button class="swatch" data-color="#ff4d6d" style="--c:#ff4d6d" aria-label="Hồng"></button>
        </div>
      </div>
      <div class="set-row">
        <h3>Dữ liệu trên trình duyệt</h3>
        <button class="set-btn" id="clear-favs">Xóa danh sách phim yêu thích</button>
        <button class="set-btn" id="reset-notifs">Đặt lại thông báo đã đọc</button>
      </div>
    </div>
  </dialog>

  <main>
    <div id="player-container" style="display:none;"></div>
    <div id="rows"></div>
    <div id="pagination"></div>
  </main>

  <button class="to-top" id="to-top" aria-label="Lên đầu trang"><svg class="ico"><use href="#i-up"/></svg></button>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script type="module" src="auth.js"></script>
  <script>
    const $id = (id) => document.getElementById(id);

    // Mở một danh mục: đánh dấu nút, đổi nhãn, tải dữ liệu
    window.openCategory = function (cat, label) {
      if (!cat) return;
      document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("active", c.dataset.cat === cat));
      $id("section-label").textContent = label || "Trang chủ";
      document.querySelectorAll(".dd[open]").forEach((d) => d.removeAttribute("open"));
      $id("search").value = "";
      window.loadData(cat, 1);
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    function goTo(el) { window.openCategory(el.dataset.cat, el.dataset.label); }

    // Đóng menu thả xuống khi bấm ra ngoài
    document.addEventListener("click", (e) => {
      document.querySelectorAll(".dd[open]").forEach((d) => { if (!d.contains(e.target)) d.removeAttribute("open"); });
    });

        // Header đậm dần khi cuộn + nút lên đầu trang
    const hdr = document.querySelector(".site-header"), toTop = $id("to-top");
    const onScroll = () => { const y = window.scrollY; hdr.classList.toggle("scrolled", y > 20); toTop.classList.toggle("show", y > 700); };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

    // Mũi tên cuộn danh mục
    const chips = $id("chips"), next = $id("chip-next");
    const syncNext = () => { next.style.visibility = chips.scrollLeft + chips.clientWidth >= chips.scrollWidth - 4 ? "hidden" : "visible"; };
    next.addEventListener("click", () => chips.scrollBy({ left: 320, behavior: "smooth" }));
    chips.addEventListener("scroll", syncNext);
    window.addEventListener("resize", syncNext);
    syncNext();
  </script>
</body>
</html>
