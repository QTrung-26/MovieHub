<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Thanh điều hướng -->
  <header class="nav">
    <h1 class="logo" onclick="loadData('phim-moi-cap-nhat', 1)">MOVIEHUB</h1>
    
    <nav class="categories">
      <button onclick="loadData('phim-moi-cap-nhat', 1)">Mới Nhất</button>
      <button onclick="loadData('phim-le', 1)">Phim Lẻ</button>
      <button onclick="loadData('phim-bo', 1)">Phim Bộ</button>
      <button onclick="loadData('hoat-hinh', 1)">Hoạt Hình</button>
      <button onclick="loadData('tv-shows', 1)">TV Shows</button>
    </nav>

    <input id="search" type="search" placeholder="Tìm kiếm phim...">
    <button id="favBtn">❤ Yêu thích</button>
  </header>

  <!-- Khung phát phim chi tiết (Ẩn đi mặc định) -->
  <section id="player-container" style="display: none; padding: 30px 40px; background: #171717;"></section>
  
  <!-- Khu vực hiển thị danh sách phim / trang chủ -->
  <main id="rows"></main>
  
  <!-- Phân trang -->
  <div id="pagination"></div>

  <footer>Dữ liệu phim từ KKPhim & Ophim API.</footer>
  
  <script src="app.js"></script>
</body>
</html>
