<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - QT</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-box">
        <a class="auth-back" href="index.html">← Về trang chủ</a>
        <img class="auth-logo" src="logo.png" alt="QT">

        <div class="auth-notice" id="notice" hidden>
          Chưa kết nối Firebase. Mở file <strong>firebase-config.js</strong>, dán cấu hình dự án của bạn vào rồi tải lại trang.
        </div>

        <!-- Khi đã đăng nhập -->
        <div class="session-box" id="session-box" hidden>
          <p>Bạn đang đăng nhập với tên <strong id="session-name"></strong></p>
          <a href="index.html">Tiếp tục xem phim</a>
          <button type="button" id="session-logout">Đăng xuất</button>
        </div>

        <div id="auth-main" style="display: contents;">
          <div class="auth-tabs" id="tabs">
            <button type="button" class="tab active" data-mode="login">Đăng nhập</button>
            <button type="button" class="tab" data-mode="register">Đăng ký</button>
          </div>

          <!-- Email -->
          <div id="email-pane" style="display: contents;">
            <form id="auth-form" novalidate>
              <label id="name-field" hidden>Tên hiển thị<input id="auth-name" autocomplete="name"></label>
              <label>Email<input id="auth-email" type="email" autocomplete="email"></label>
              <label>Mật khẩu<input id="auth-pw" type="password" autocomplete="current-password"></label>
              <label id="pw2-field" hidden>Nhập lại mật khẩu<input id="auth-pw2" type="password" autocomplete="new-password"></label>
              <button type="button" class="link-btn" id="forgot">Quên mật khẩu?</button>
              <button class="auth-submit" id="email-submit" type="submit">Đăng nhập</button>
            </form>
          </div>

          <!-- Số điện thoại -->
          <div id="phone-pane" style="display: contents;" hidden>
            <form id="phone-form" novalidate>
              <p class="phone-hint">Nhập số điện thoại, chúng tôi gửi mã 6 số qua SMS. Số chưa có tài khoản sẽ được tạo mới tự động.</p>
              <label>Số điện thoại<input id="phone" type="tel" placeholder="0912 345 678" autocomplete="tel"></label>
              <button class="auth-submit" id="send-code" type="submit">Gửi mã xác nhận</button>
              <div id="code-step" hidden>
                <label>Mã xác nhận<input id="code" inputmode="numeric" maxlength="6" placeholder="6 chữ số" autocomplete="one-time-code"></label>
                <button class="auth-submit" id="confirm-code" type="button">Xác nhận và đăng nhập</button>
              </div>
            </form>
          </div>

          <p class="auth-error" id="auth-error" role="alert"></p>

          <div class="auth-or"><span>hoặc tiếp tục với</span></div>
          <div class="auth-alt">
            <button type="button" class="alt-btn" id="google-btn">
              <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
              Google
            </button>
            <button type="button" class="alt-btn" id="phone-toggle"><span id="phone-toggle-label">Số điện thoại</span></button>
          </div>
          <div id="recaptcha"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import * as A from "./auth.js";

    const $ = (id) => document.getElementById(id);
    let mode = "login", busy = false;

    // Chỉ cho quay lại file .html cùng thư mục
    const nextUrl = () => {
      const n = new URLSearchParams(location.search).get("next") || "";
      return /^[\w-]+\.html$/.test(n) ? n : "index.html";
    };
    const done = (user) => { A.syncSession(user); location.href = nextUrl(); };
    const say = (text, ok = false) => { $("auth-error").textContent = text; $("auth-error").classList.toggle("ok", ok); };

    async function run(btn, fn) {
      if (busy) return;
      busy = true; btn.disabled = true; say("");
      try { await fn(); } catch (e) { say(A.friendlyError(e)); } finally { busy = false; btn.disabled = false; }
    }

    // +84: nhận 0912..., 84912..., +84912...
    function toE164(raw) {
      let p = raw.replace(/[\s.\-()]/g, "");
      if (p.startsWith("+")) return p;
      if (p.startsWith("00")) return "+" + p.slice(2);
      if (p.startsWith("0")) return "+84" + p.slice(1);
      if (p.startsWith("84")) return "+" + p;
      return "+84" + p;
    }

    function setMode(m) {
      mode = m;
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.mode === m));
      $("name-field").hidden = $("pw2-field").hidden = m !== "register";
      $("forgot").hidden = m !== "login";
      $("auth-pw").autocomplete = m === "login" ? "current-password" : "new-password";
      $("email-submit").textContent = m === "login" ? "Đăng nhập" : "Tạo tài khoản";
      document.title = (m === "login" ? "Đăng nhập" : "Đăng ký") + " - QT";
      say("");
    }

    function showPhone(on) {
      $("email-pane").hidden = on; $("phone-pane").hidden = !on; $("tabs").hidden = on;
      $("email-pane").style.display = on ? "none" : "contents";
      $("phone-pane").style.display = on ? "contents" : "none";
      $("phone-toggle-label").textContent = on ? "Email" : "Số điện thoại";
      say("");
    }

    document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
      setMode(t.dataset.mode);
      history.replaceState(null, "", t.dataset.mode === "register" ? "#register" : location.pathname + location.search);
    }));
    $("phone-toggle").addEventListener("click", () => showPhone($("phone-pane").hidden));

    $("auth-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("auth-name").value.trim(), email = $("auth-email").value.trim(), pw = $("auth-pw").value;
      run($("email-submit"), async () => {
        if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error("Email chưa đúng định dạng.");
        if (pw.length < 6) throw new Error("Mật khẩu cần ít nhất 6 ký tự.");
        if (mode === "register") {
          if (!name) throw new Error("Vui lòng nhập tên hiển thị.");
          if (pw !== $("auth-pw2").value) throw new Error("Mật khẩu nhập lại chưa khớp.");
          done(await A.registerEmail(name, email, pw));
        } else {
          done(await A.loginEmail(email, pw));
        }
      });
    });

    $("forgot").addEventListener("click", () => {
      const email = $("auth-email").value.trim();
      run($("forgot"), async () => {
        if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error("Nhập email của bạn vào ô Email trước.");
        await A.resetPassword(email);
        say("Đã gửi email đặt lại mật khẩu tới " + email + ". Hãy kiểm tra hộp thư.", true);
      });
    });

    $("google-btn").addEventListener("click", () => run($("google-btn"), async () => done(await A.loginGoogle())));

    $("phone-form").addEventListener("submit", (e) => {
      e.preventDefault();
      run($("send-code"), async () => {
        const phone = toE164($("phone").value);
        if (!/^\+\d{9,15}$/.test(phone)) throw new Error("Số điện thoại chưa đúng.");
        await A.sendPhoneCode(phone, "recaptcha");
        $("code-step").hidden = false;
        $("send-code").textContent = "Gửi lại mã";
        say("Đã gửi mã tới " + phone + ".", true);
        $("code").focus();
      });
    });
    $("confirm-code").addEventListener("click", () => {
      run($("confirm-code"), async () => {
        const code = $("code").value.trim();
        if (!/^\d{6}$/.test(code)) throw new Error("Mã xác nhận gồm 6 chữ số.");
        done(await A.confirmPhoneCode(code));
      });
    });

    // Chưa cấu hình Firebase: báo rõ và khóa biểu mẫu
    if (!A.configured) {
      $("notice").hidden = false;
      document.querySelectorAll("#auth-main button, #auth-main input").forEach((el) => (el.disabled = true));
    }

    // Đã đăng nhập sẵn thì hiện thông tin thay cho biểu mẫu
    await A.ready;
    const u = A.auth?.currentUser;
    if (u) {
      $("auth-main").style.display = "none";
      $("session-box").hidden = false;
      $("session-name").textContent = u.displayName || u.email || u.phoneNumber || "bạn";
      $("session-logout").addEventListener("click", async () => { await A.logout(); location.reload(); });
    }

    showPhone(false);
    setMode(location.hash === "#register" ? "register" : "login");
  </script>
</body>
</html>
